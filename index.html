<script>
const streamMap = {
  AW: ['str_AW_SC','str_AW_ED','str_AW_PA'],
  KN: ['str_KN_SC','str_KN_PO'],
  TR: ['str_TR_SC','str_TR_PO'],
  RD: ['str_RD_SC','str_RD_PA','str_RD_PO'],
  ED: [], PO: [], PA: [], SC: []
};
const rcStreams = {
  ED: ['str_AW_ED'],
  PO: ['str_KN_PO','str_TR_PO','str_RD_PO'],
  PA: ['str_AW_PA','str_RD_PA'],
  SC: ['str_AW_SC','str_KN_SC','str_TR_SC','str_RD_SC']
};
function hlC(cl){
  const isRC = ['ED','PO','PA','SC'].includes(cl);
  document.querySelectorAll('.fl').forEach(l=>{
    const m = l.getAttribute('data-cl')===cl;
    l.classList.toggle('active',m);
    l.classList.toggle('dim',!m);
  });
  const activeStreams = isRC ? (rcStreams[cl]||[]) : (streamMap[cl]||[]);
  document.querySelectorAll('.stream').forEach(s=>{
    const m = activeStreams.includes(s.id);
    s.classList.toggle('active',m);
    s.classList.toggle('dim',!m);
  });
  document.querySelectorAll('.cb').forEach(b=>{
    b.classList.toggle('dim', b.id!=='c'+cl);
  });
}
document.querySelector('svg').addEventListener('click',e=>{
  if(!e.target.closest('.cb')){
    document.querySelectorAll('.fl').forEach(l=>l.classList.remove('active','dim'));
    document.querySelectorAll('.stream').forEach(s=>s.classList.remove('active','dim'));
    document.querySelectorAll('.cb').forEach(b=>b.classList.remove('dim'));
  }
});
</script>
